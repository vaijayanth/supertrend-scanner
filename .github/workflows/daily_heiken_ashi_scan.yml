name: Daily Heiken Ashi Scan

on:
  schedule:
    # 4:00 PM IST (10:30 UTC) - Every day
    - cron: "30 10 * * *"

    # 5:00 PM IST (11:30 UTC) - Every day
    - cron: "30 11 * * *"

    # 10:00 PM IST (16:30 UTC) - Every day
    - cron: "30 16 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

# No repository write is required anymore
permissions:
  contents: read

# Prevent overlapping scanner runs
concurrency:
  group: heiken-ashi-scan
  cancel-in-progress: false

jobs:
  run-heiken-scan:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3. Cache pip dependencies
      # ---------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------------------------------------------------------
      # 4. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # 5. Run Heiken Ashi scanner
      # ---------------------------------------------------------
      - name: Run Heiken Ashi scanner
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python heiken_ashi_scan.py

      # ---------------------------------------------------------
      # 6. Record successful scan time
      # ---------------------------------------------------------
      - name: Record scan completion
        run: |
          echo "========================================="
          echo "HEIKEN ASHI SCAN COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "Scan completed at:"
          TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST'
          echo "========================================="

name: Daily Heiken Ashi Scan

on:
  schedule:
    # 4:00 PM IST (10:30 UTC) - Every day
    - cron: "30 10 * * *"

    # 5:00 PM IST (11:30 UTC) - Every day
    - cron: "30 11 * * *"

    # 10:00 PM IST (16:30 UTC) - Every day
    - cron: "30 16 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

# Allow GitHub Actions to commit the scan activity file
permissions:
  contents: write

jobs:
  run-heiken-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Heiken Ashi scanner
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python heiken_ashi_scan.py

      # Update repository activity only after a successful scan
      - name: Update scan activity
        run: |
          echo "Last successful scan: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_scan.txt

      # Commit the activity timestamp
      - name: Commit scan activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_scan.txt
          git diff --cached --quiet || git commit -m "Update daily scan activity"
          git push
